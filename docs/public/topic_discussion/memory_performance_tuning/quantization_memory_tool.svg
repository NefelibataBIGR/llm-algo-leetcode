<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="98" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Quantization as a Memory Tool</text>
  <text x="88" y="130" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">In this topic, quantization is judged by what memory object it compresses and whether the saved budget is worth the time or quality cost.</text>

  <rect x="98" y="188" width="320" height="374" rx="24" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="126" y="226" fill="#5B21B6" font-size="24" font-family="Arial, sans-serif" font-weight="700">Weight quantization</text>
  <text x="126" y="264" fill="#5B21B6" font-size="18" font-family="Arial, sans-serif">Main question:</text>
  <text x="126" y="292" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">Can the model fit in the first place?</text>
  <rect x="126" y="336" width="260" height="150" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="152" y="372" fill="#5B21B6" font-size="18" font-family="Arial, sans-serif">Typical routes</text>
  <text x="152" y="404" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">• W8A16</text>
  <text x="152" y="428" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">• GPTQ</text>
  <text x="152" y="452" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">• AWQ</text>
  <text x="126" y="528" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">Good when resident weight size is the hard limit.</text>

  <rect x="480" y="188" width="320" height="374" rx="24" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="508" y="226" fill="#1E3A8A" font-size="24" font-family="Arial, sans-serif" font-weight="700">Activation precision</text>
  <text x="508" y="264" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">Main question:</text>
  <text x="508" y="292" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Can the live path lower bandwidth / memory use?</text>
  <rect x="508" y="336" width="260" height="150" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="534" y="372" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">Typical routes</text>
  <text x="534" y="404" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• FP8</text>
  <text x="534" y="428" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• backend low-precision kernels</text>
  <text x="508" y="528" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Good when the stack already supports low precision end-to-end.</text>

  <rect x="862" y="188" width="320" height="374" rx="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="890" y="226" fill="#166534" font-size="24" font-family="Arial, sans-serif" font-weight="700">KV cache quantization</text>
  <text x="890" y="264" fill="#166534" font-size="18" font-family="Arial, sans-serif">Main question:</text>
  <text x="890" y="292" fill="#166534" font-size="16" font-family="Arial, sans-serif">Can context length / concurrency fit the budget?</text>
  <rect x="890" y="336" width="260" height="150" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="916" y="372" fill="#166534" font-size="18" font-family="Arial, sans-serif">Typical routes</text>
  <text x="916" y="404" fill="#166534" font-size="16" font-family="Arial, sans-serif">• FP8 KV cache</text>
  <text x="916" y="428" fill="#166534" font-size="16" font-family="Arial, sans-serif">• dedicated cache quantization</text>
  <text x="890" y="528" fill="#166534" font-size="16" font-family="Arial, sans-serif">Good when cache growth, not weights, is the budget wall.</text>

  <rect x="98" y="604" width="1084" height="28" rx="10" fill="#ECFCCB" stroke="#65A30D" stroke-width="1.5"/>
  <text x="126" y="622" fill="#365314" font-size="16" font-family="Arial, sans-serif">Routing rule: first identify which object must fit. Only then choose whether weight, activation, or KV cache quantization is the right memory action.</text>
</svg>
