<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Prefix Caching and Chunked Prefill</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Reuse removes repeated prefill work; chunking reduces single-pass pressure.</text>
  <rect x="102" y="208" width="238" height="108" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="164" y="246" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Cached Prefix</text>
  <text x="134" y="278" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">shared system prompt</text>
  <text x="134" y="300" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">tool schema / history</text>
  <rect x="390" y="208" width="254" height="108" rx="20" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="456" y="246" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">New Prompt</text>
  <text x="428" y="278" fill="#92400E" font-size="16" font-family="Arial, sans-serif">find longest prefix hit</text>
  <text x="428" y="300" fill="#92400E" font-size="16" font-family="Arial, sans-serif">split reusable part and suffix</text>
  <rect x="694" y="208" width="222" height="108" rx="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="742" y="246" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Suffix</text>
  <text x="724" y="278" fill="#166534" font-size="16" font-family="Arial, sans-serif">only this part needs</text>
  <text x="724" y="300" fill="#166534" font-size="16" font-family="Arial, sans-serif">fresh prefill work</text>
  <rect x="966" y="208" width="180" height="108" rx="20" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="998" y="246" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Chunks</text>
  <text x="992" y="278" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">block 1, 2, 3...</text>
  <text x="992" y="300" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">scheduled in order</text>
  <path d="M340 262H390" stroke="#374151" stroke-width="3"/>
  <path d="M644 262H694" stroke="#374151" stroke-width="3"/>
  <path d="M916 262H966" stroke="#374151" stroke-width="3"/>
  <path d="M375 254L390 262L375 270" fill="#374151"/>
  <path d="M679 254L694 262L679 270" fill="#374151"/>
  <path d="M951 254L966 262L951 270" fill="#374151"/>
  <rect x="102" y="388" width="1044" height="126" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="132" y="428" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">Operational reading</text>
  <text x="132" y="462" fill="#374151" font-size="18" font-family="Arial, sans-serif">Prefix caching answers "what can be skipped safely". Chunked prefill answers "how should the remaining work enter the GPU".</text>
  <text x="132" y="492" fill="#374151" font-size="18" font-family="Arial, sans-serif">If the hit length grows, repeated compute shrinks. If the chunk size is too large, prefill becomes harder to schedule fairly.</text>
  <rect x="102" y="550" width="1044" height="76" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="132" y="584" fill="#075985" font-size="18" font-family="Arial, sans-serif">Page 34 should leave the reader with one boundary: reuse is a cache question; chunking is a scheduling question.</text>
</svg>
