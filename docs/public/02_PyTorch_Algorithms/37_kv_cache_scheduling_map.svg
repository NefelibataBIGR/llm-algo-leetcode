<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">KV Cache Scheduling Map</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Retention value changes over time, so scheduling must refresh scores and ignore stale heap records.</text>
  <rect x="96" y="206" width="214" height="108" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="146" y="246" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Touch Prefix</text>
  <text x="126" y="278" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">reuse hit or add new block</text>
  <text x="126" y="300" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">update hits and last used</text>
  <rect x="364" y="206" width="236" height="108" rx="20" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="430" y="246" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Recompute Score</text>
  <text x="392" y="278" fill="#92400E" font-size="16" font-family="Arial, sans-serif">reuse bonus plus recency</text>
  <text x="392" y="300" fill="#92400E" font-size="16" font-family="Arial, sans-serif">minus size penalty</text>
  <rect x="654" y="206" width="216" height="108" rx="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="708" y="246" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Heap Queue</text>
  <text x="684" y="278" fill="#166534" font-size="16" font-family="Arial, sans-serif">push fresh priority record</text>
  <text x="684" y="300" fill="#166534" font-size="16" font-family="Arial, sans-serif">old records stay stale</text>
  <rect x="924" y="206" width="222" height="108" rx="20" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="966" y="246" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Evict if Needed</text>
  <text x="952" y="278" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">skip stale heap items first</text>
  <text x="952" y="300" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">remove lowest-value live entry</text>
  <path d="M310 260H364" stroke="#374151" stroke-width="3"/>
  <path d="M600 260H654" stroke="#374151" stroke-width="3"/>
  <path d="M870 260H924" stroke="#374151" stroke-width="3"/>
  <path d="M349 252L364 260L349 268" fill="#374151"/>
  <path d="M639 252L654 260L639 268" fill="#374151"/>
  <path d="M909 252L924 260L909 268" fill="#374151"/>
  <rect x="96" y="382" width="1050" height="146" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="126" y="422" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">Why stale records matter</text>
  <text x="126" y="456" fill="#374151" font-size="18" font-family="Arial, sans-serif">Each cache hit changes priority, so the heap may still contain outdated ranks for the same prefix. A live scheduler must compare popped values against the newest entry before evicting.</text>
  <text x="126" y="488" fill="#374151" font-size="18" font-family="Arial, sans-serif">Without that stale check, the system can evict a hot shared prefix simply because an old low score was still sitting in the queue.</text>
  <rect x="96" y="558" width="1050" height="68" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="126" y="590" fill="#075985" font-size="18" font-family="Arial, sans-serif">Page 37 should leave one scheduler rule: KV cache value is dynamic, so queue order must be refreshed and stale decisions must be rejected.</text>
</svg>
