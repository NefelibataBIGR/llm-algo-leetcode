<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 780" role="img" aria-labelledby="title desc">
  <title id="title">Tensor parallel split</title>
  <desc id="desc">Shows column and row parallel decomposition of a linear layer with different communication patterns.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke-width: 3; rx: 16; ry: 16; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1660" height="780" fill="url(#bg)"/>
  <text x="64" y="66" class="title">Tensor parallelism: split a linear layer by dimension</text>
  <text x="64" y="96" class="sub">Column parallel splits output features; row parallel splits input features. The communication pattern changes with the split.</text>

  <rect x="90" y="160" width="1470" height="120" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="120" y="196" class="label">Why tensor parallel exists</text>
  <text x="120" y="230" class="small">a single large linear layer can still be too heavy even after model-level partitioning</text>
  <text x="120" y="256" class="small">so we split the weight matrix itself and compute together across devices</text>

  <rect x="100" y="330" width="680" height="180" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="130" y="368" class="label">Column parallel</text>
  <text x="130" y="402" class="small">split output columns of W</text>
  <text x="130" y="432" class="small">each GPU computes partial output features</text>
  <text x="130" y="462" class="small">often needs All-Gather to assemble full output</text>

  <rect x="880" y="330" width="680" height="180" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="910" y="368" class="label">Row parallel</text>
  <text x="910" y="402" class="small">split input rows of W</text>
  <text x="910" y="432" class="small">each GPU computes partial contributions</text>
  <text x="910" y="462" class="small">often needs All-Reduce to sum outputs</text>

  <path d="M 780 420 L 880 420" class="arrow"/>

  <rect x="90" y="560" width="1470" height="150" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="598" class="label">What to remember</text>
  <text x="120" y="632" class="small">1. tensor parallel splits the matrix itself, not the optimizer state or the batch.</text>
  <text x="120" y="662" class="small">2. column and row parallel differ mainly in what needs to be communicated after local compute.</text>
  <text x="120" y="692" class="small">3. the diagram should make the split direction and communication direction obvious.</text>
</svg>
