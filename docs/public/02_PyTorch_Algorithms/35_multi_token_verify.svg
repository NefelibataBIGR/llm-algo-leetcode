<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Multi-Token Decoding Verification Loop</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">The gain comes from consecutive acceptance, not from emitting many tokens unconditionally.</text>
  <rect x="100" y="208" width="210" height="104" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="160" y="246" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Propose</text>
  <text x="128" y="278" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">draft tokens t1 t2 t3 t4</text>
  <text x="128" y="300" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">cut to proposal length</text>
  <rect x="370" y="208" width="210" height="104" rx="20" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="432" y="246" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Verify</text>
  <text x="404" y="278" fill="#92400E" font-size="16" font-family="Arial, sans-serif">target model checks</text>
  <text x="404" y="300" fill="#92400E" font-size="16" font-family="Arial, sans-serif">each token from left to right</text>
  <rect x="640" y="208" width="226" height="104" rx="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="698" y="246" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Accept Prefix</text>
  <text x="670" y="278" fill="#166534" font-size="16" font-family="Arial, sans-serif">t1 accepted, t2 accepted</text>
  <text x="670" y="300" fill="#166534" font-size="16" font-family="Arial, sans-serif">advance multiple tokens</text>
  <rect x="926" y="208" width="220" height="104" rx="20" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="988" y="246" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Rollback</text>
  <text x="956" y="278" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">first rejected token stops</text>
  <text x="956" y="300" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">remaining suffix falls back</text>
  <path d="M310 260H370" stroke="#374151" stroke-width="3"/>
  <path d="M580 260H640" stroke="#374151" stroke-width="3"/>
  <path d="M866 260H926" stroke="#374151" stroke-width="3"/>
  <path d="M355 252L370 260L355 268" fill="#374151"/>
  <path d="M625 252L640 260L625 268" fill="#374151"/>
  <path d="M911 252L926 260L911 268" fill="#374151"/>
  <rect x="100" y="378" width="1046" height="154" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="132" y="420" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">What decides whether this is worth it</text>
  <text x="132" y="454" fill="#374151" font-size="18" font-family="Arial, sans-serif">Longer proposals increase upside only if the acceptance prefix usually stays long. Otherwise the system pays verification cost and still rolls back early.</text>
  <text x="132" y="486" fill="#374151" font-size="18" font-family="Arial, sans-serif">So the core trade-off is proposal aggressiveness versus rollback frequency, not "more proposed tokens is always better".</text>
  <rect x="100" y="558" width="1046" height="68" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="132" y="590" fill="#075985" font-size="18" font-family="Arial, sans-serif">Page 35 should leave one control-flow picture: propose in batch, verify in order, stop at first rejection, keep only the accepted prefix.</text>
</svg>
