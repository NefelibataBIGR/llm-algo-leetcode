<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 780" role="img" aria-labelledby="title desc">
  <title id="title">ZeRO optimizer sharding</title>
  <desc id="desc">Shows parameters, gradients, and optimizer states being sharded across devices in ZeRO family strategies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke-width: 3; rx: 16; ry: 16; }
      .device { fill: #fff; stroke-width: 3; rx: 14; ry: 14; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1660" height="780" fill="url(#bg)"/>
  <text x="64" y="66" class="title">ZeRO: shard optimizer state, gradients, and parameters</text>
  <text x="64" y="96" class="sub">The family gradually splits more training state across devices to reduce per-GPU memory.</text>

  <rect x="80" y="160" width="1470" height="120" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="120" y="196" class="label">What stays too big in plain data parallelism</text>
  <text x="120" y="230" class="small">every GPU keeps a full copy of parameters, gradients, and optimizer states</text>
  <text x="120" y="256" class="small">that is why memory grows fast with model size</text>

  <rect x="100" y="330" width="440" height="180" class="device" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="320" y="366" text-anchor="middle" class="label">GPU 0</text>
  <text x="320" y="402" text-anchor="middle" class="small">param shard 0</text>
  <text x="320" y="432" text-anchor="middle" class="small">grad shard 0</text>
  <text x="320" y="462" text-anchor="middle" class="small">optimizer shard 0</text>

  <rect x="610" y="330" width="440" height="180" class="device" fill="#ecfccb" stroke="#65a30d"/>
  <text x="830" y="366" text-anchor="middle" class="label">GPU 1</text>
  <text x="830" y="402" text-anchor="middle" class="small">param shard 1</text>
  <text x="830" y="432" text-anchor="middle" class="small">grad shard 1</text>
  <text x="830" y="462" text-anchor="middle" class="small">optimizer shard 1</text>

  <rect x="1120" y="330" width="440" height="180" class="device" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="1340" y="366" text-anchor="middle" class="label">GPU 2</text>
  <text x="1340" y="402" text-anchor="middle" class="small">param shard 2</text>
  <text x="1340" y="432" text-anchor="middle" class="small">grad shard 2</text>
  <text x="1340" y="462" text-anchor="middle" class="small">optimizer shard 2</text>

  <path d="M 540 420 L 610 420" class="arrow"/>
  <path d="M 1050 420 L 1120 420" class="arrow"/>

  <rect x="90" y="560" width="1470" height="150" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="598" class="label">What ZeRO levels mean</text>
  <text x="120" y="632" class="small">ZeRO-1 shards optimizer state, ZeRO-2 shards gradients too, and ZeRO-3 shards parameters as well.</text>
  <text x="120" y="662" class="small">The diagram should make the unit of sharding obvious before the communication details appear.</text>
</svg>
