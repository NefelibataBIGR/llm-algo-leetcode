<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 690" role="img" aria-labelledby="title desc">
  <title id="title">LoRA adapter diagram</title>
  <desc id="desc">Shows frozen base linear branch and a trainable low-rank LoRA branch with A and B matrices and merge path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke-width: 3; rx: 18; ry: 18; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #ef4444; stroke-width: 4; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="690" fill="url(#bg)"/>
  <text x="64" y="66" class="title">LoRA: frozen base branch + trainable low-rank branch</text>
  <text x="64" y="96" class="sub">Freeze W0, train only A and B, then optionally merge the low-rank delta back for inference.</text>

  <rect x="80" y="210" width="140" height="90" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="150" y="244" text-anchor="middle" class="label">input x</text>
  <text x="150" y="270" text-anchor="middle" class="small">hidden state</text>

  <rect x="280" y="200" width="230" height="110" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="395" y="235" text-anchor="middle" class="label">Frozen W0</text>
  <text x="395" y="262" text-anchor="middle" class="small">base Linear branch</text>
  <text x="395" y="286" text-anchor="middle" class="small">requires_grad = False</text>

  <rect x="280" y="390" width="230" height="110" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="395" y="425" text-anchor="middle" class="label">LoRA A</text>
  <text x="395" y="452" text-anchor="middle" class="small">d -> r down-projection</text>
  <text x="395" y="476" text-anchor="middle" class="small">trainable low-rank path</text>

  <rect x="590" y="390" width="230" height="110" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="705" y="425" text-anchor="middle" class="label">LoRA B</text>
  <text x="705" y="452" text-anchor="middle" class="small">r -> d up-projection</text>
  <text x="705" y="476" text-anchor="middle" class="small">delta W = B A</text>

  <rect x="590" y="200" width="230" height="110" class="box" fill="#fff1f2" stroke="#e11d48"/>
  <text x="705" y="235" text-anchor="middle" class="label">base output</text>
  <text x="705" y="262" text-anchor="middle" class="small">W0 x</text>
  <text x="705" y="286" text-anchor="middle" class="small">frozen representation</text>

  <rect x="900" y="240" width="140" height="90" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="970" y="274" text-anchor="middle" class="label">+</text>
  <text x="970" y="298" text-anchor="middle" class="small">merge / sum</text>

  <rect x="1090" y="210" width="170" height="90" class="box" fill="#ecfeff" stroke="#0891b2"/>
  <text x="1175" y="244" text-anchor="middle" class="label">output</text>
  <text x="1175" y="270" text-anchor="middle" class="small">W0 x + BAx</text>

  <rect x="1290" y="210" width="240" height="90" class="box" fill="#fdf2f8" stroke="#db2777"/>
  <text x="1410" y="244" text-anchor="middle" class="label">merged weight</text>
  <text x="1410" y="270" text-anchor="middle" class="small">W0 + alpha/r * B A</text>

  <path d="M 220 255 L 280 255" class="arrow"/>
  <path d="M 510 255 L 590 255" class="arrow"/>
  <path d="M 220 255 C 250 340 260 390 280 445" class="dashed"/>
  <path d="M 510 445 L 590 445" class="arrow"/>
  <path d="M 820 445 C 860 445 880 320 900 285" class="arrow"/>
  <path d="M 820 255 L 900 285" class="arrow"/>
  <path d="M 1040 285 L 1090 255" class="arrow"/>
  <path d="M 1260 255 L 1290 255" class="arrow"/>

  <rect x="80" y="570" width="1440" height="90" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="110" y="608" class="label">Read it in one line</text>
  <text x="110" y="642" class="small">LoRA keeps the base branch frozen, learns a small low-rank correction on the side, and can merge that correction back before deployment.</text>
</svg>
