<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Prefill / Decode Disaggregation</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Split only when prefill and decode need clearly different resources.</text>
  <rect x="110" y="208" width="278" height="118" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="174" y="248" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Prefill Service</text>
  <text x="138" y="282" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">long prompt ingest</text>
  <text x="138" y="304" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">compute-heavy, bandwidth-heavy</text>
  <rect x="500" y="208" width="278" height="118" rx="20" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="562" y="248" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Handoff</text>
  <text x="526" y="282" fill="#92400E" font-size="16" font-family="Arial, sans-serif">move request state and</text>
  <text x="526" y="304" fill="#92400E" font-size="16" font-family="Arial, sans-serif">cache ownership boundary</text>
  <rect x="890" y="208" width="278" height="118" rx="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="954" y="248" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Decode Service</text>
  <text x="918" y="282" fill="#166534" font-size="16" font-family="Arial, sans-serif">short iterative token loop</text>
  <text x="918" y="304" fill="#166534" font-size="16" font-family="Arial, sans-serif">cache- and scheduler-heavy</text>
  <path d="M388 266H500" stroke="#374151" stroke-width="3"/>
  <path d="M778 266H890" stroke="#374151" stroke-width="3"/>
  <path d="M485 258L500 266L485 274" fill="#374151"/>
  <path d="M875 258L890 266L875 274" fill="#374151"/>
  <rect x="110" y="398" width="1058" height="144" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="140" y="458" fill="#374151" font-size="18" font-family="Arial, sans-serif">Split when one pool cannot serve long-prompt prefill and iterative decode efficiently at the same time.</text>
  <text x="140" y="492" fill="#374151" font-size="18" font-family="Arial, sans-serif">Check throughput gain against handoff and cache-management cost.</text>
  <rect x="110" y="566" width="1058" height="60" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="140" y="598" fill="#075985" font-size="18" font-family="Arial, sans-serif">Resource specialization must beat state-transfer cost.</text>
</svg>
