<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 700" role="img" aria-labelledby="title desc">
  <title id="title">Speculative decoding flow</title>
  <desc id="desc">Shows a draft model proposing tokens and a target model verifying them with accept or reject decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke-width: 3; rx: 16; ry: 16; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .accept { stroke: #16a34a; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .reject { stroke: #ef4444; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1660" height="700" fill="url(#bg)"/>
  <text x="64" y="66" class="title">Speculative decoding: draft first, verify later</text>
  <text x="64" y="96" class="sub">A small draft model proposes several tokens, then the target model accepts or rejects them one by one.</text>

  <rect x="90" y="180" width="320" height="120" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="250" y="216" text-anchor="middle" class="label">Draft model</text>
  <text x="250" y="246" text-anchor="middle" class="small">propose K tokens</text>
  <text x="250" y="272" text-anchor="middle" class="small">fast proposal path</text>

  <rect x="480" y="180" width="360" height="120" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="660" y="216" text-anchor="middle" class="label">Candidate tokens</text>
  <text x="660" y="246" text-anchor="middle" class="small">x1, x2, x3, ... xK</text>
  <text x="660" y="272" text-anchor="middle" class="small">x1, x2, ... xK</text>

  <rect x="910" y="180" width="320" height="120" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="1070" y="216" text-anchor="middle" class="label">Target model</text>
  <text x="1070" y="246" text-anchor="middle" class="small">verify each candidate</text>
  <text x="1070" y="272" text-anchor="middle" class="small">correctness stays here</text>

  <rect x="1280" y="180" width="290" height="120" class="box" fill="#fff1f2" stroke="#db2777"/>
  <text x="1425" y="216" text-anchor="middle" class="label">Accept / Reject</text>
  <text x="1425" y="246" text-anchor="middle" class="small">continue or stop</text>
  <text x="1425" y="272" text-anchor="middle" class="small">accept or stop early</text>

  <path d="M 410 240 L 480 240" class="arrow"/>
  <path d="M 840 240 L 910 240" class="arrow"/>
  <path d="M 1230 240 L 1280 240" class="arrow"/>

  <path d="M 1070 300 C 1070 370 660 370 660 300" class="accept"/>
  <path d="M 1070 300 C 1070 430 1425 430 1425 300" class="reject"/>

  <rect x="90" y="360" width="1470" height="120" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="398" class="label">Verification loop</text>
  <text x="120" y="432" class="small">Accept tokens that pass target-model verification; stop at the first rejection.</text>
  <text x="120" y="462" class="small">After rejection, later draft tokens are discarded and generation returns to the target model.</text>

  <rect x="90" y="530" width="1470" height="110" class="box" fill="#fffef2" stroke="#cbd5e1"/>
  <text x="120" y="568" class="label">Read it in one line</text>
  <text x="120" y="602" class="small">The draft model buys speed; the target model still decides which tokens become part of the final output.</text>
</svg>
