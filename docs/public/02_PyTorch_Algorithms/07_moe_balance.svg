<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 760" role="img" aria-labelledby="title desc">
  <title id="title">MoE Load Balancing Diagram</title>
  <desc id="desc">Shows how load balancing loss prevents expert collapse and encourages more even token distribution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke-width: 3; rx: 18; ry: 18; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 13px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .barGood { fill: #86efac; stroke: #16a34a; stroke-width: 2; }
      .barBad { fill: #fca5a5; stroke: #dc2626; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1540" height="760" fill="url(#bg)"/>
  <text x="64" y="66" class="title">MoE load balancing: avoid expert collapse</text>
  <text x="64" y="96" class="sub">A small auxiliary loss keeps token routing from piling into only a few experts</text>

  <rect x="80" y="150" width="420" height="200" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="290" y="192" text-anchor="middle" class="label">Collapsed routing</text>
  <rect x="120" y="230" width="60" height="80" class="barBad"/>
  <rect x="195" y="200" width="60" height="110" class="barBad"/>
  <rect x="270" y="182" width="60" height="128" class="barBad"/>
  <rect x="345" y="270" width="60" height="40" class="barBad"/>
  <rect x="420" y="286" width="60" height="24" class="barBad"/>
  <text x="290" y="332" text-anchor="middle" class="small">few experts overloaded, others idle</text>

  <rect x="560" y="150" width="420" height="200" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="770" y="192" text-anchor="middle" class="label">Balanced routing</text>
  <rect x="600" y="240" width="60" height="70" class="barGood"/>
  <rect x="675" y="230" width="60" height="80" class="barGood"/>
  <rect x="750" y="235" width="60" height="75" class="barGood"/>
  <rect x="825" y="225" width="60" height="85" class="barGood"/>
  <rect x="900" y="238" width="60" height="72" class="barGood"/>
  <text x="770" y="332" text-anchor="middle" class="small">tokens spread more evenly across experts</text>

  <rect x="1040" y="150" width="420" height="200" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1250" y="192" text-anchor="middle" class="label">Auxiliary loss</text>
  <text x="1070" y="235" class="small">main task loss + small load balancing term</text>
  <text x="1070" y="265" class="small">encourage similar usage frequency</text>
  <text x="1070" y="295" class="small">encourage stable router probabilities</text>
  <text x="1070" y="325" class="small">prevents expert collapse during training</text>

  <rect x="120" y="430" width="1300" height="180" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="770" y="470" text-anchor="middle" class="label">Why it matters</text>
  <text x="150" y="510" class="small">1. router quality and expert utilization are tied together</text>
  <text x="150" y="540" class="small">2. good routing keeps capacity useful instead of just large</text>
  <text x="150" y="570" class="small">3. without balance, sparse MoE degenerates into a few hot experts</text>
  <text x="780" y="510" class="small">This is why the MoE chapter needs a separate loss page, not only a router page</text>
  <text x="780" y="540" class="small">Sparse routing is a model choice; load balancing is the training constraint that makes it work</text>
</svg>
